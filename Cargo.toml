[package]
name = "litefences"
version = "0.2.0"
edition = "2024"
publish = false
description = "轻量 Windows 桌面启动器：磨砂面板、图标分组、拖入引用"
license = "MIT"
authors = ["Ltsunahi"]
repository = "https://github.com/Ltsunahi/LiteFences"
readme = "README.md"
keywords = ["windows", "desktop", "launcher", "win32"]
categories = ["gui", "os::windows-apis"]

[features]
default = ["config-store"]
config-store = ["dep:serde", "dep:serde_json", "dep:windows", "dep:windows-core", "windows/Win32_System_Com", "windows/Win32_System_Com_StructuredStorage", "windows/Win32_System_Ole", "windows/Win32_System_SystemServices", "windows/Win32_UI_Shell", "windows/Win32_UI_Shell_Common", "windows/Win32_Graphics_Gdi", "windows-sys/Win32_Storage_FileSystem", "windows-sys/Win32_System_Threading", "windows-sys/Win32_Security", "windows-sys/Win32_UI_Input_KeyboardAndMouse", "windows-sys/Win32_UI_Controls_Dialogs", "windows-sys/Win32_UI_Shell", "windows-sys/Win32_UI_Shell_Common", "windows-sys/Win32_System_Registry"]
render-bench = ["dep:windows"]
shell = [
    "dep:windows",
    "dep:windows-core",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Ole",
    "windows/Win32_System_SystemServices",
    "windows/Win32_UI_Shell",
    "windows/Win32_UI_Shell_Common",
    "windows/Win32_Storage_FileSystem",
    "windows-sys/Win32_UI_Shell",
    "windows-sys/Win32_UI_Shell_Common",
    "windows-sys/Win32_UI_Controls",
    "windows-sys/Win32_System_Com",
    "windows-sys/Win32_Graphics_Dwm",
    "windows-sys/Win32_Globalization",
    "dep:serde",
    "dep:serde_json",
    "windows-sys/Win32_System_Threading",
    "windows-sys/Win32_System_SystemInformation",
    "windows-sys/Win32_Security",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_UI_Input_KeyboardAndMouse",
    "windows-sys/Win32_UI_Controls_Dialogs",
    "windows-sys/Win32_System_Registry",
]
desktop-probe = ["dep:windows", "windows/Win32_System_Com", "windows/Win32_System_Ole", "windows/Win32_System_Variant", "windows/Win32_UI_Shell"]
ui-acceptance = ["config-store", "windows-sys/Win32_System_StationsAndDesktops"]

[[bin]]
name = "desktop-probe"
path = "src/bin/desktop_probe.rs"
required-features = ["desktop-probe"]

[[bin]]
name = "litefences-desktop"
path = "src/bin/litefences_desktop.rs"
required-features = ["shell"]

[[bin]]
name = "render-bench"
path = "src/bin/render_bench.rs"
required-features = ["render-bench"]

[[bin]]
name = "litefences-ui-acceptance"
path = "src/bin/ui_acceptance.rs"
required-features = ["ui-acceptance"]

[[bin]]
name = "loop-diagnostic"
path = "src/bin/loop_diagnostic.rs"
required-features = ["ui-acceptance"]

[[bin]]
name = "loop-diagnostic-visible"
path = "src/bin/loop_diagnostic_visible.rs"
required-features = ["ui-acceptance"]

[[bin]]
name = "undo-visible-acceptance"
path = "src/bin/undo_visible_acceptance.rs"
required-features = ["ui-acceptance"]

[[bin]]
name = "undo-group-visible-acceptance"
path = "src/bin/undo_group_visible_acceptance.rs"
required-features = ["ui-acceptance"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
] }
windows-core = { version = "=0.62.2", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
