name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 里锁了版本，rustup 会自动装好
      - name: Toolchain
        run: rustup show

      - name: Build (shell launcher)
        run: cargo build --release --features shell --locked

      - name: Test (desktop launcher)
        run: cargo test --release --features shell --locked --bin litefences-desktop

      - name: Build (v1 prototype)
        run: cargo build --release --locked

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.*
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          ./scripts/Build-Msi.ps1 -Out dist/LiteFences-x64.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: LiteFences-msi
          path: dist/*.msi
          if-no-files-found: error
